<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024"><defs>
      <filter id="granite" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="11" result="n1"></feTurbulence>
        <feColorMatrix in="n1" type="matrix" values="0 0 0 0 0.20  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 9 -5.7" result="dark"></feColorMatrix>
        <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="1" seed="4" result="n2"></feTurbulence>
        <feColorMatrix in="n2" type="matrix" values="0 0 0 0 0.97  0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 10 -5.9" result="light"></feColorMatrix>
        <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="21" result="n3"></feTurbulence>
        <feColorMatrix in="n3" type="matrix" values="0 0 0 0 0.80  0 0 0 0 0.66  0 0 0 0 0.60  0 0 0 10 -6.3" result="pink"></feColorMatrix>
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="cloud"></feTurbulence>
        <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.28  0 0 0 0 0.25  0 0 0 0.5 -0.15" result="mottle"></feColorMatrix>
        <feMerge><feMergeNode in="SourceGraphic"></feMergeNode><feMergeNode in="mottle"></feMergeNode><feMergeNode in="pink"></feMergeNode><feMergeNode in="dark"></feMergeNode><feMergeNode in="light"></feMergeNode></feMerge>
        <feComposite in2="SourceGraphic" operator="in"></feComposite>
      </filter>
      <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"></feDropShadow>
      </filter>
      <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
        <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"></feDropShadow>
      </filter>
      <linearGradient id="stone" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#CFC8BC"></stop>
        <stop offset="1" stop-color="#A39A8D"></stop>
      </linearGradient>
      <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#DCD6CB"></stop>
        <stop offset="1" stop-color="#C4BCAF"></stop>
      </linearGradient>
      <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ABA295"></stop>
        <stop offset="1" stop-color="#958C7F"></stop>
      </linearGradient>
      <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7F776B"></stop>
        <stop offset="1" stop-color="#6A6257"></stop>
      </linearGradient>
      <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#506070"></stop>
        <stop offset="1" stop-color="#29323B"></stop>
      </linearGradient>
      <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#F4F6F8"></stop>
        <stop offset="0.45" stop-color="#B9C0C7"></stop>
        <stop offset="1" stop-color="#5F666D"></stop>
      </linearGradient>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8FB7D6"></stop>
        <stop offset="1" stop-color="#D6E4EC"></stop>
      </linearGradient>
      <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9DBB6C"></stop>
        <stop offset="1" stop-color="#6E8F47"></stop>
      </linearGradient>
      <linearGradient id="cutDark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2E2924"></stop>
        <stop offset="1" stop-color="#3C362F"></stop>
      </linearGradient>
      <linearGradient id="markStone" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#DDD7CC"></stop>
        <stop offset="1" stop-color="#B9B0A3"></stop>
      </linearGradient>
      <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"></rect></clipPath>
      <clipPath id="aClip"><path d="M183 -10Q136 -10 104.0 14.0Q72 38 56.0 79.5Q40 121 40 173Q40 220 53.0 271.5Q66 323 92.0 371.5Q118 420 156.0 459.5Q194 499 243.5 522.5Q293 546 354 546Q380 546 407.0 541.0Q434 536 457.0 528.0Q480 520 495 511L548 535H601L535 223Q533 212 528.5 192.0Q524 172 521.0 151.5Q518 131 518 118Q518 93 527.5 81.0Q537 69 553 69Q567 69 580.0 75.0Q593 81 609 90L631 50Q614 37 591.0 23.0Q568 9 538.5 -0.5Q509 -10 473 -10Q429 -10 402.0 10.5Q375 31 375 70Q375 86 376.5 101.0Q378 116 382 135H375Q351 89 325.0 56.5Q299 24 265.5 7.0Q232 -10 183 -10ZM246 70Q268 70 291.0 88.5Q314 107 335.0 138.5Q356 170 372.5 209.0Q389 248 397 288L432 454Q422 468 405.0 475.0Q388 482 368 482Q333 482 305.0 461.0Q277 440 256.0 405.0Q235 370 220.5 329.0Q206 288 199.0 246.5Q192 205 192 172Q192 114 207.5 92.0Q223 70 246 70Z" transform="translate(246.5,732.1) scale(0.7914,-0.7914)"></path></clipPath>

      <!-- 1 · Mark on a stone: the site's a (Noto Serif Bold Italic), cut
           into granite. Light from the upper left: the cut's upper-left wall
           is in shadow, its lower-right wall catches the light. -->
      <symbol id="i1" viewBox="0 0 1024 1024">
        <g filter="url(#lift)">
          <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#markStone)" filter="url(#granite)"></rect>
          <path d="M183 -10Q136 -10 104.0 14.0Q72 38 56.0 79.5Q40 121 40 173Q40 220 53.0 271.5Q66 323 92.0 371.5Q118 420 156.0 459.5Q194 499 243.5 522.5Q293 546 354 546Q380 546 407.0 541.0Q434 536 457.0 528.0Q480 520 495 511L548 535H601L535 223Q533 212 528.5 192.0Q524 172 521.0 151.5Q518 131 518 118Q518 93 527.5 81.0Q537 69 553 69Q567 69 580.0 75.0Q593 81 609 90L631 50Q614 37 591.0 23.0Q568 9 538.5 -0.5Q509 -10 473 -10Q429 -10 402.0 10.5Q375 31 375 70Q375 86 376.5 101.0Q378 116 382 135H375Q351 89 325.0 56.5Q299 24 265.5 7.0Q232 -10 183 -10ZM246 70Q268 70 291.0 88.5Q314 107 335.0 138.5Q356 170 372.5 209.0Q389 248 397 288L432 454Q422 468 405.0 475.0Q388 482 368 482Q333 482 305.0 461.0Q277 440 256.0 405.0Q235 370 220.5 329.0Q206 288 199.0 246.5Q192 205 192 172Q192 114 207.5 92.0Q223 70 246 70Z" transform="translate(249.5,736.1) scale(0.7914,-0.7914)" fill="#EEE9DF" opacity="0.8"></path>
          <g clip-path="url(#aClip)">
            <rect x="100" y="100" width="824" height="824" fill="url(#cutDark)"></rect>
            <path d="M183 -10Q136 -10 104.0 14.0Q72 38 56.0 79.5Q40 121 40 173Q40 220 53.0 271.5Q66 323 92.0 371.5Q118 420 156.0 459.5Q194 499 243.5 522.5Q293 546 354 546Q380 546 407.0 541.0Q434 536 457.0 528.0Q480 520 495 511L548 535H601L535 223Q533 212 528.5 192.0Q524 172 521.0 151.5Q518 131 518 118Q518 93 527.5 81.0Q537 69 553 69Q567 69 580.0 75.0Q593 81 609 90L631 50Q614 37 591.0 23.0Q568 9 538.5 -0.5Q509 -10 473 -10Q429 -10 402.0 10.5Q375 31 375 70Q375 86 376.5 101.0Q378 116 382 135H375Q351 89 325.0 56.5Q299 24 265.5 7.0Q232 -10 183 -10ZM246 70Q268 70 291.0 88.5Q314 107 335.0 138.5Q356 170 372.5 209.0Q389 248 397 288L432 454Q422 468 405.0 475.0Q388 482 368 482Q333 482 305.0 461.0Q277 440 256.0 405.0Q235 370 220.5 329.0Q206 288 199.0 246.5Q192 205 192 172Q192 114 207.5 92.0Q223 70 246 70Z" transform="translate(260.5,748.1) scale(0.7914,-0.7914)" fill="#5F574C"></path>
            <path d="M183 -10Q136 -10 104.0 14.0Q72 38 56.0 79.5Q40 121 40 173Q40 220 53.0 271.5Q66 323 92.0 371.5Q118 420 156.0 459.5Q194 499 243.5 522.5Q293 546 354 546Q380 546 407.0 541.0Q434 536 457.0 528.0Q480 520 495 511L548 535H601L535 223Q533 212 528.5 192.0Q524 172 521.0 151.5Q518 131 518 118Q518 93 527.5 81.0Q537 69 553 69Q567 69 580.0 75.0Q593 81 609 90L631 50Q614 37 591.0 23.0Q568 9 538.5 -0.5Q509 -10 473 -10Q429 -10 402.0 10.5Q375 31 375 70Q375 86 376.5 101.0Q378 116 382 135H375Q351 89 325.0 56.5Q299 24 265.5 7.0Q232 -10 183 -10ZM246 70Q268 70 291.0 88.5Q314 107 335.0 138.5Q356 170 372.5 209.0Q389 248 397 288L432 454Q422 468 405.0 475.0Q388 482 368 482Q333 482 305.0 461.0Q277 440 256.0 405.0Q235 370 220.5 329.0Q206 288 199.0 246.5Q192 205 192 172Q192 114 207.5 92.0Q223 70 246 70Z" transform="translate(260.5,748.1) scale(0.7914,-0.7914)" fill="#5F574C" filter="url(#granite)" opacity="0.5"></path>
          </g>
          <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"></rect>
        </g>
      </symbol>

      <!-- 2 · Chisel and block: a rough-dressed block, light from the left,
           and a mason's chisel leaning on it. -->
      <symbol id="i2" viewBox="0 0 1024 1024">
        <g filter="url(#lift)">
          <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#slate)"></rect>
          <g clip-path="url(#squircle)" filter="url(#soft)">
            <polygon points="300,470 560,400 760,470 500,545" fill="url(#faceTop)" filter="url(#granite)"></polygon>
            <polygon points="300,470 500,545 500,760 300,690" fill="url(#faceLeft)" filter="url(#granite)"></polygon>
            <polygon points="500,545 760,470 760,690 500,760" fill="url(#faceRight)" filter="url(#granite)"></polygon>
            <!-- Bush-hammered face: rows of short tool marks. -->
            <g stroke="#9E9588" stroke-width="4" stroke-linecap="round" opacity="0.65">
              <line x1="380" y1="470" x2="396" y2="466"></line><line x1="420" y1="460" x2="436" y2="456"></line><line x1="460" y1="449" x2="476" y2="445"></line><line x1="500" y1="438" x2="516" y2="434"></line><line x1="540" y1="428" x2="556" y2="424"></line>
              <line x1="420" y1="490" x2="436" y2="486"></line><line x1="460" y1="479" x2="476" y2="475"></line><line x1="500" y1="468" x2="516" y2="464"></line><line x1="540" y1="458" x2="556" y2="454"></line><line x1="580" y1="447" x2="596" y2="443"></line>
              <line x1="470" y1="508" x2="486" y2="504"></line><line x1="510" y1="497" x2="526" y2="493"></line><line x1="550" y1="487" x2="566" y2="483"></line><line x1="590" y1="476" x2="606" y2="472"></line><line x1="630" y1="465" x2="646" y2="461"></line>
            </g>
            <!-- Edge highlights. -->
            <polyline points="300,470 500,545 760,470" fill="none" stroke="#F2EEE6" stroke-width="4" stroke-opacity="0.7"></polyline>
            <line x1="500" y1="545" x2="500" y2="760" stroke="#5D564C" stroke-width="3" stroke-opacity="0.6"></line>
          </g>
          <!-- The chisel: striking head, octagonal shank, broad flat blade. -->
          <g transform="rotate(-38 560 420)" filter="url(#soft)">
            <rect x="330" y="398" width="300" height="52" rx="6" fill="url(#steel)"></rect>
            <polygon points="630,398 742,386 752,424 742,462 630,450" fill="url(#steel)"></polygon>
            <line x1="742" y1="388" x2="742" y2="460" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.7"></line>
            <path d="M296,388 Q280,424 296,460 L340,454 L340,394 Z" fill="#7B828A"></path>
            <rect x="338" y="404" width="286" height="10" rx="5" fill="#FFFFFF" opacity="0.45"></rect>
          </g>
        </g>
      </symbol>

      <!-- 3 · Dry-stone wall: rounded granite stones, gaps dark, a green
           leira and hill behind. Seen straight on. -->
      <symbol id="i3" viewBox="0 0 1024 1024">
        <g filter="url(#lift)">
          <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"></rect>
          <g clip-path="url(#squircle)">
            <path d="M100,470 Q330,380 560,430 Q760,470 924,400 L924,924 L100,924 Z" fill="url(#hill)"></path>
            <rect x="100" y="560" width="824" height="380" fill="#3E3730"></rect>
            <g filter="url(#granite)">
              <!-- Cap stones -->
              <rect x="88" y="548" width="168" height="96" rx="44" fill="#BDB5A8"></rect>
              <rect x="266" y="540" width="214" height="104" rx="48" fill="#CDC6BA"></rect>
              <rect x="490" y="552" width="150" height="92" rx="42" fill="#B2A99C"></rect>
              <rect x="650" y="538" width="190" height="106" rx="50" fill="#C6BEB1"></rect>
              <rect x="850" y="550" width="110" height="94" rx="42" fill="#B9B0A3"></rect>
              <!-- Middle course -->
              <rect x="60" y="654" width="226" height="118" rx="52" fill="#C2BAAD"></rect>
              <rect x="296" y="652" width="150" height="120" rx="52" fill="#A79E91"></rect>
              <rect x="456" y="656" width="236" height="116" rx="54" fill="#CBC3B7"></rect>
              <rect x="702" y="652" width="160" height="120" rx="52" fill="#B4AB9E"></rect>
              <rect x="872" y="656" width="120" height="116" rx="50" fill="#C7BFB3"></rect>
              <!-- Bottom course -->
              <rect x="90" y="782" width="160" height="150" rx="58" fill="#ACA396"></rect>
              <rect x="260" y="782" width="250" height="150" rx="60" fill="#C9C2B6"></rect>
              <rect x="520" y="782" width="170" height="150" rx="58" fill="#B7AEA1"></rect>
              <rect x="700" y="782" width="230" height="150" rx="60" fill="#C3BBAF"></rect>
            </g>
            <!-- Light on the stones' upper edges. -->
            <g fill="none" stroke="#F3EFE7" stroke-opacity="0.5" stroke-width="5" stroke-linecap="round">
              <path d="M120,560 Q170,550 230,556"></path><path d="M300,552 Q370,542 450,550"></path><path d="M680,550 Q750,540 815,548"></path>
              <path d="M90,666 Q160,656 260,664"></path><path d="M486,668 Q570,658 665,666"></path><path d="M290,794 Q380,784 480,792"></path>
            </g>
          </g>
        </g>
      </symbol>
    </defs><use href="#i1" xlink:href="#i1"/></svg>